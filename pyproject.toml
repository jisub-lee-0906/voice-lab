[project]
name = "voice-lab"
version = "0.1.0"
description = "Local web UI for generating emotion-aware voice takes with GPT-SoVITS"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.124.0",
  "python-multipart>=0.0.20",
  "requests>=2.32.0",
  "pyyaml>=6.0.0",
  "uvicorn[standard]>=0.38.0",
  "numpy>=2.4.4",
  "praat-parselmouth>=0.4.7",
]

[project.scripts]
voice-lab = "voice_lab.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_lab"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
